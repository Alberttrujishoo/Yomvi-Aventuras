<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>YOMVI AVENTURAS 1.0 BY AMONGOLICUS PRODUCTIONS</title>
<meta name="description" content="Conviertete en Yomvi y haz lo necesario para robarte el Dance Masters 2" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="AMONGOLICUS PRODUCTIONS" />
<meta property="og:title" content="YOMVI AVENTURAS 1.0 BY AMONGOLICUS PRODUCTIONS" />
<meta property="og:description" content="Conviertete en Yomvi y haz lo necesario para robarte el Dance Masters 2" />
<meta property="og:image" content="assets/images/cover.jpg" />
<meta property="og:image:alt" content="YOMVI AVENTURAS — portada" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="YOMVI AVENTURAS 1.0 BY AMONGOLICUS PRODUCTIONS" />
<meta name="twitter:description" content="Conviertete en Yomvi y haz lo necesario para robarte el Dance Masters 2" />
<meta name="twitter:image" content="assets/images/cover.jpg" />
<link rel="stylesheet" href="styles/game.css" />
<link rel="manifest" href="assets/yomvi.webmanifest" />
</head>
<body>
  <div id="stage-wrap">
    <canvas id="game" width="960" height="540" aria-label="Juego arcade Yomvi Adventures"></canvas>

    <div id="loading">
      <div class="load-inner">
        <div class="load-logo">YOMVI<span>ADVENTURES</span></div>
        <div class="load-bar"><i id="loadFill"></i></div>
        <div class="load-status" id="loadStatus">CARGANDO YOMVI ADVENTURES…</div>

      </div>
    </div>
  </div>

  <div id="intro" class="hidden" aria-hidden="true">
    <video id="introVideo" src="assets/video/intro.mp4" playsinline preload="metadata"></video>
    <button type="button" id="skipIntro">Omitir intro</button>
    <div id="introHint">PULSA UNA TECLA O TOCA LA PANTALLA PARA ACTIVAR EL SONIDO</div>
  </div>

  <button type="button" id="touchStart" hidden>Iniciar</button>
  <button type="button" id="fullscreenBtn" aria-label="Pantalla completa" aria-pressed="false" hidden>⛶</button>

  <div id="touch-controls" role="group" aria-label="Controles táctiles">
    <div id="joystick" class="joystick" role="group" aria-label="Joystick de movimiento">
      <div id="joystickKnob" class="joystick-knob" aria-hidden="true"></div>
      <span class="joystick-label" aria-hidden="true">MOVER</span>
    </div>
    <div class="action-cluster">
      <button type="button" class="touch-btn touch-jump" data-action="jump" aria-label="Saltar">SALTO</button>
      <button type="button" class="touch-btn touch-special" data-action="special" aria-label="Giro especial">ESP.</button>
      <button type="button" class="touch-btn touch-attack" data-action="attack" aria-label="Golpear">GOLPE</button>
    </div>
    <button type="button" id="pauseBtn" class="touch-btn touch-pause" aria-label="Pausa">II</button>
  </div>

  <div id="rotateHint">
    <div class="rotate-icon">⟳</div>
    <div class="rotate-title">GIRA TU TELÉFONO</div>
    <div class="rotate-sub">YOMVI ADVENTURES SE JUEGA EN HORIZONTAL</div>
  </div>

  <script type="module" src="src/main.js"></script>
  <noscript>Activa JavaScript para jugar a Yomvi Adventures.</noscript>
</body>
</html>
